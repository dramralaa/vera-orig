name: Vera Jahez Catalog Probe (manual, read-only)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Vera's Jahez catalog
        env:
          JAHEZ_TOKEN_VERA: ${{ secrets.JAHEZ_TOKEN_VERA }}
        run: python scripts/vera_jahez_catalog_probe.py
